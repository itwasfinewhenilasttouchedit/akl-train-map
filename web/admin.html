<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Train reports — moderation</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#2b313a; --fg:#e6edf3;
          --dim:#8b949e; --red:#D52923; --amber:#d29922; --green:#3fb950; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45
         ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         padding:18px; }
  h1 { font-size:18px; margin:0 0 2px; }
  .sub { color:var(--dim); font-size:12.5px; margin-bottom:14px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center;
         margin-bottom:14px; }
  input[type=password], input[type=text] {
    background:#0b0f14; color:var(--fg); border:1px solid var(--line);
    border-radius:7px; padding:7px 10px; font:inherit; min-width:230px; }
  button { background:#1f2630; color:var(--fg); border:1px solid var(--line);
           border-radius:7px; padding:7px 12px; font:inherit; cursor:pointer; }
  button:hover { background:#273040; }
  button.danger { border-color:#5e2626; color:#ff9a92; }
  button.danger:hover { background:#3a1b1b; }
  #msg { font-size:12.5px; color:var(--dim); margin-bottom:10px; min-height:17px; }
  .r { background:var(--panel); border:1px solid var(--line); border-radius:9px;
       padding:10px 12px; margin-bottom:8px; display:flex; gap:12px;
       align-items:flex-start; flex-wrap:wrap; }
  .r.hid { opacity:.45; }
  .set { font-weight:700; font-size:15px; min-width:58px; }
  .meta { flex:1; min-width:200px; }
  .cat { font-weight:600; }
  .s1 { color:var(--green); } .s2 { color:var(--amber); } .s3 { color:var(--red); }
  .note { color:var(--fg); margin-top:3px; word-break:break-word; }
  .when { color:var(--dim); font-size:12px; margin-top:3px; }
  .acts { display:flex; gap:6px; }
  .tag { font-size:11px; border:1px solid var(--line); border-radius:999px;
         padding:1px 7px; color:var(--dim); }
  .stats { color:var(--dim); font-size:12.5px; margin-bottom:12px; }
</style>
</head>
<body>
<h1>Train reports — moderation</h1>
<div class="sub">Hiding is reversible and removes a report from the public map
  immediately. Delete is permanent — use it only when the content must actually
  be gone.</div>

<div class="bar">
  <input type="password" id="tok" placeholder="admin token" autocomplete="off">
  <button id="load">Load</button>
  <button id="forget">Forget token</button>
</div>
<div id="msg"></div>
<div class="stats" id="stats"></div>
<div id="rows"></div>

<script>
// Every value from the API is escaped before it reaches innerHTML: notes are
// public user input on a public site, so this is the one that actually matters.
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const $ = id => document.getElementById(id);
const SEV = {1:'minor', 2:'moderate', 3:'severe'};

function token() { return $('tok').value.trim(); }

// Kept in sessionStorage, not localStorage: it dies with the tab, which is the
// right lifetime for an admin credential on a shared or borrowed machine.
try { const t = sessionStorage.getItem('admtok'); if (t) $('tok').value = t; } catch (e) {}

async function api(path, opts = {}) {
  const r = await fetch(path, {
    ...opts,
    cache: 'no-store',
    headers: { ...(opts.headers || {}), 'x-admin-token': token() },
  });
  if (r.status === 401) throw new Error('token rejected');
  if (!r.ok) {
    let m = 'request failed (' + r.status + ')';
    try { m = (await r.json()).error || m; } catch (e) {}
    throw new Error(m);
  }
  return r.json();
}

function render(d) {
  const s = d.stats || {};
  $('stats').textContent =
    `${s.reports ?? 0} visible reports across ${s.units ?? 0} units` +
    (d.reports ? ` · ${d.reports.length} shown including hidden` : '');

  $('rows').innerHTML = (d.reports || []).map(r => `
    <div class="r ${r.hidden ? 'hid' : ''}" data-id="${r.id}">
      <div class="set">${esc(r.set_no)}</div>
      <div class="meta">
        <span class="cat">${esc(r.category_label || r.category)}</span>
        <span class="s${esc(r.severity)}">· ${esc(SEV[r.severity] || r.severity)}</span>
        ${r.hidden ? '<span class="tag">hidden</span>' : ''}
        ${r.case_ref ? `<span class="tag">${esc(r.case_ref)}</span>` : ''}
        ${r.note ? `<div class="note">${esc(r.note)}</div>` : ''}
        <!-- No reporter shown: reports are anonymous and no identity is stored. -->
        <div class="when">${esc(r.occurred_at || r.created_at || '')}</div>
      </div>
      <div class="acts">
        <button class="hide">${r.hidden ? 'Unhide' : 'Hide'}</button>
        <button class="danger del">Delete</button>
      </div>
    </div>`).join('') || '<div class="sub">No reports.</div>';
}

async function load() {
  try {
    $('msg').textContent = 'loading…';
    const d = await api('/api/admin/reports?limit=300');
    try { sessionStorage.setItem('admtok', token()); } catch (e) {}
    render(d);
    $('msg').textContent = '';
  } catch (e) {
    $('msg').textContent = e.message;
    $('rows').innerHTML = '';
    $('stats').textContent = '';
  }
}

$('load').onclick = load;
$('tok').addEventListener('keydown', e => { if (e.key === 'Enter') load(); });
$('forget').onclick = () => {
  try { sessionStorage.removeItem('admtok'); } catch (e) {}
  $('tok').value = ''; $('rows').innerHTML = ''; $('stats').textContent = '';
  $('msg').textContent = 'token forgotten';
};

// Delegated: rows are rebuilt on every load.
document.addEventListener('click', async ev => {
  const row = ev.target.closest('.r');
  if (!row) return;
  const id = row.dataset.id;
  try {
    if (ev.target.classList.contains('hide')) {
      const nowHidden = !row.classList.contains('hid');
      await api(`/api/admin/reports/${id}/hide`, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ hidden: nowHidden }),
      });
      await load();
    } else if (ev.target.classList.contains('del')) {
      if (!confirm('Permanently delete report ' + id + '? This cannot be undone.')) return;
      await api(`/api/admin/reports/${id}`, { method: 'DELETE' });
      await load();
    }
  } catch (e) {
    $('msg').textContent = e.message;
  }
});

if (token()) load();
</script>
</body>
</html>
