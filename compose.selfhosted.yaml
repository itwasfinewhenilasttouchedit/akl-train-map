# Auckland train map, self-hosted deployment (isolated DMZ VLAN).
#
# Differs from the Fly deployment in four ways that matter:
#
# 1. NO CR_SECRET_URL. The gateway ACL denies this VLAN -> all internal VLANs,
#    so the internal secret service is unreachable from here by design. The AT
#    key is injected from .env, which is written once at provisioning time and
#    is chmod 600, never committed. See src/deploy_pull.sh.
# 2. State lives on a host bind-mount, not a Fly volume. The order latch must
#    survive a restart or every stationary 6-car loses its front/rear order
#    until it next pulls away.
# 3. Resource caps. This is a phone: the SoC thermally clamps to 1.04 GHz at
#    85C and thermal-guard.service enforces that in userspace. Capping the
#    container keeps a runaway poll loop from cooking the SoC or starving
#    sshd -- which is the only way back in short of a USB cable.
# 4. NO CANONICAL_HOST. This host is the canonical origin, so it must serve,
#    not redirect. Setting it here would make the site redirect to itself.
#
# This file IS tracked in git. The pull-based deployer resets the working tree
# to origin/main, so an untracked compose file would be the one part of prod
# nobody could reproduce. It deliberately holds no secrets -- everything
# sensitive is in .env, which git ignores.

services:
  akl-train-map:
    build:
      context: .
      dockerfile: Dockerfile
    image: akl-train-map:local
    container_name: akl-train-map
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 8080
      # Service Info (vehicles/byTripId) ONLY accepts AT's public Journey
      # Planner key -- a registered dev-portal key 401s with "not subscribed
      # to Service Info", which silently drops consist detection back to
      # geometric inference (~62% recall). This key is published in AT's own
      # front-end JS bundle, so it is not a secret and is pinned here rather
      # than in .env. Pinned in `environment` deliberately: it overrides
      # env_file, so a stale .env copy cannot reintroduce the 401.
      AT_SERVICEINFO_KEY: "693150c317fc42c5a2f871aee3f586af"
      FEEDBACK_DB: /data/feedback.db
      # Persistent observation archive. Zero extra AT quota (it subscribes to
      # the poll the server already makes). Measured 62.5 B/row => ~15.5 MB/day,
      # ~5.7 GB/year against 209 GB free. On the bind-mount because it is the
      # one thing here that must outlive the container. ARCHIVE_DB=off kills it.
      ARCHIVE_DB: /data/archive.db
      # Keep the latch beside the DB, on the volume: it is state, not image.
      ORDER_LATCH: /data/order_latch.json
      TRAINS_CACHE: /data/last_trains.json
      # First-party traffic log for the analytics container below. Combined
      # format so GoAccess parses it with no custom format string. On the
      # bind-mount so it survives a container rebuild, and rotated by the app
      # (20MB x 5) because this is flash with finite write endurance.
      ACCESS_LOG: /data/access.log
      # The client address is taken from CF-Connecting-IP. That header is only
      # trustworthy because the tunnel is the single inbound path to this
      # origin -- nothing else can reach the port to forge it. Set to 0 if
      # this app is ever exposed directly.
      ACCESS_LOG_TRUST_PROXY: "1"
    volumes:
      - ./data:/data
    ports:
      # Bound to all interfaces so the tunnel (host network) can reach it.
      # Safe here: the VLAN is isolated and the gateway denies inbound from WAN.
      - "8731:8080"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1500M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    logging:
      driver: json-file
      options:
        # UFS is flash with finite writes; don't let logs grow unbounded.
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------- analytics
  # GoAccess in real-time HTML mode: it tails the access log the app writes and
  # serves a self-updating dashboard over a websocket.
  #
  # NOT PUBLIC, AND NOT PUBLISHABLE BY ACCIDENT. The port is bound to this
  # host's DMZ address only -- NOT 0.0.0.0 -- so the dashboard is reachable
  # exclusively from the one admin host the gateway ACL permits into this VLAN
  # (rule 0). The Cloudflare tunnel has no ingress rule for it, so it cannot
  # appear on the public hostname even by misconfiguration: there is nothing
  # for the tunnel to route.
  #
  # Nothing here is wired into the page: there is no analytics JavaScript, no
  # third-party beacon, and no change to what a visitor's browser contacts.
  # The data is the server's own log of requests it already served.
  goaccess:
    image: allinurl/goaccess:1.9.3
    container_name: akl-goaccess
    restart: unless-stopped
    depends_on:
      akl-train-map:
        # service_started is not enough: the app creates access.log a moment
        # AFTER it starts listening, and GoAccess dies on a missing log file
        # ("Unable to open the specified log file") rather than waiting. The
        # entrypoint below closes the remaining gap; this closes the big one.
        condition: service_healthy
    # Read-only mount: the dashboard must never be able to alter or truncate
    # the log it reports on.
    volumes:
      - ./data:/srv/data:ro
      - ./data/goaccess:/srv/report
    ports:
      # ${DMZ_BIND} comes from .env (the host's own VLAN address). Deliberately
      # not hardcoded: the address is site detail and this file is public.
      # Defaults to loopback, so a missing .env entry fails CLOSED -- reachable
      # only on the phone itself, never accidentally exposed to the subnet.
      #
      # This is the WEBSOCKET port, not an HTTP port: curling it returns 400.
      # The dashboard itself is an HTML file written to ./data/goaccess, served
      # by the dash-web container below. Both must be reachable from the admin
      # host, because the page opens a websocket back to this port to live-update.
      # Container port is 443 on purpose: GoAccess bakes --port into the page and
      # the browser connects to wss://<ws-url host>:<that port>. 443 is the default
      # wss port, so a reverse proxy on 443 can front it. Host port stays 7890.
      - "${DMZ_BIND:-127.0.0.1}:7890:443"
    # TZ so the dashboard's hourly breakdown reads in local time. The app logs
    # with a numeric offset, so GoAccess needs --tz to agree with it or every
    # bucket lands 13 hours out -- which on a commuter site would put the
    # morning peak in the previous evening.
    environment:
      TZ: Pacific/Auckland
    # Wait for the log to exist before parsing. Without this the container
    # crash-loops on a cold start where the app has not served a request yet.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 60); do
          [ -f /srv/data/access.log ] && break
          echo "waiting for access.log ($$i)"; sleep 2
        done
        exec goaccess \
          --log-file=/srv/data/access.log \
          --log-format=COMBINED \
          --real-time-html \
          --port=443 \
          --ws-url=${DASH_WS_URL:-ws://127.0.0.1:7890} \
          --output=/srv/report/index.html \
          --db-path=/srv/report \
          --persist --restore \
          --tz=Pacific/Auckland \
          --agent-list \
          --ignore-crawlers \
          --no-progress
    deploy:
      resources:
        limits:
          # Parsing is cheap but must never compete with serving traffic.
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # Serves the GoAccess HTML report. GoAccess's own --port is a websocket, not
  # an HTTP server (curling it returns 400), so the report file needs something
  # to serve it. nginx:alpine read-only over the report directory is the whole
  # job -- no config, no PHP, nothing that can write.
  #
  # Same binding discipline as above: the host's LAN address from .env, never
  # 0.0.0.0, defaulting to loopback so a missing value fails closed. No tunnel
  # ingress rule exists for it, so it cannot reach the public hostname.
  dash-web:
    image: nginx:1.27-alpine
    container_name: akl-dash-web
    restart: unless-stopped
    depends_on:
      - goaccess
    volumes:
      # :ro throughout -- a traffic dashboard has no business writing anything.
      - ./data/goaccess:/usr/share/nginx/html:ro
    ports:
      - "${DMZ_BIND:-127.0.0.1}:7891:80"
    environment:
      TZ: Pacific/Auckland
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
