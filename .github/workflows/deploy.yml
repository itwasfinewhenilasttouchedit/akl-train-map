# Build and gate the Auckland train map.
#
# This workflow does NOT deploy. Production is the self-hosted instance at
# trains.hoki.co.nz, which deploys pull-based: a systemd timer on the host runs
# src/deploy_pull.sh every ~5 minutes, which fetches origin/main, builds,
# smoke-tests a candidate on a scratch port, promotes it, and rolls back on any
# failure. The push IS the deploy; there is nothing to trigger from here.
#
# The Fly app (akl-trains) was retired on 2026-11-26. Its trial ended and the
# app went to `suspended`: it now serves NOTHING -- TCP connects to Fly's edge
# and TLS then fails with no peer certificate, from every network tested. Note
# that this also killed the old 301 from akl-trains.fly.dev to the canonical
# host, because that redirect came from CANONICAL_HOST inside the app, not from
# Fly's router. Any stale inbound link to the fly.dev name is now dead rather
# than redirected. That is acceptable: the fly.dev host was never advertised
# and the canonical host is in sitemap.xml and every rel=canonical tag.
#
# Fly deploys had in fact already stopped before the suspension -- the render
# gate below was failing, and the job is sequential, so the deploy step was
# being SKIPPED. Worth remembering when reading old runs: a skipped step and a
# successful one are both "not failed" in the Actions API, and skimming a run
# summary will show a deploy that never happened as if it were fine.
#
# One lesson kept deliberately, because it cost real debugging time:
# deploy_pull.sh does not run the unit suite, so a gate that exists only here
# is invisible in production -- which is why a CI-only gate referencing an
# untracked test file sat red for days without anyone noticing.
#
# Gates are sequential and ordered cheapest-first, so a failure stops the run
# early. Every check here has caught a real defect that was invisible in the
# source.
name: gates

on:
  push:
    branches: [main]
  # Hand-run from the Actions tab, for re-gating without a code change.
  workflow_dispatch:

# Serialise runs. Each one builds Docker images and binds container ports on
# the runner, so overlapping runs collide on the fixed `akl-ci` / `shotci`
# container names. `cancel-in-progress: false` because a half-torn-down rig
# leaves stray containers that fail the NEXT run confusingly.
concurrency:
  group: gates-akl-trains
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        # Runtime deps come from requirements.txt; the suites import the app
        # modules directly, so they need the same set.
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r requirements.txt

      - name: Syntax check
        run: |
          python -m py_compile \
            src/server.py src/live.py src/alerts.py \
            src/feedback.py src/consist_at.py src/board.py

      - name: Static gates
        # Brace/tag balance, no CJK, no Google-font host in live rules, and the
        # self-hosted font files present. These are cheap and catch whole
        # classes of silent breakage in a 100KB single-page file.
        run: python src/check_static.py

      - name: Asset stamps current
        # pixel.css is cache-busted by content hash. A stale stamp means a
        # verified CSS fix stays invisible behind a mobile browser's heuristic
        # cache -- which has actually happened here. Fails if not regenerated.
        run: python src/stamp_assets.py --check

      - name: Build rail geometry
        # live.py reads output/rail_geo.json at IMPORT time, so the unit suites
        # cannot even import it without this. The file is generated, not
        # committed (it is derived from AT's 31MB GTFS zip), which is why a
        # suite that passes locally failed on a clean checkout -- the local
        # working dir had the artifact lying around from a previous build.
        # The Dockerfile runs this same step at image build time.
        env:
          AT_API_KEY: ${{ secrets.AT_API_KEY }}
        run: python src/build_static.py

      - name: Unit tests
        run: |
          test -f src/test_trailing.py || { echo "trailing-half gate missing"; exit 1; }
          test -f src/test_order_latch.py || { echo "order-latch gate missing"; exit 1; }
          test -f src/test_order_latch_e2e.py || { echo "order-latch e2e gate missing"; exit 1; }
          test -f src/test_canonical.py || { echo "canonical-redirect gate missing"; exit 1; }
          test -f src/test_accesslog.py || { echo "access-log gate missing"; exit 1; }
          python src/test_feedback.py
          python src/test_consist_at.py
          python src/test_alerts.py
          # Guards the popup's two report numbers against drifting apart again:
          # the badge counts open faults, the History button counts every kept
          # row, and any gap must be explained on screen. Extracts the real
          # histNote() from index.html and runs it under node.
          python src/test_histnote.py
          # Every GET route must also answer HEAD. FastAPI's @app.get does not
          # add HEAD (Starlette's own Route does), and a crawler HEADing
          # /sitemap.xml got a 405 in production while GET returned 200.
          ARCHIVE_DB=off python src/test_head.py
          python src/test_trailing.py
          python src/test_order_latch.py
          python src/test_order_latch_e2e.py
          # Guards the CANONICAL_HOST redirect and its /api/ exemption. Kept
          # after Fly's retirement: the exemption still matters because the
          # self-hosted container's own Docker healthcheck hits /api/health and
          # does not follow redirects, and because CANONICAL_HOST is still set
          # in any environment fronting this app under a second hostname.
          ARCHIVE_DB=off python src/test_canonical.py
          # Guards the access log. It handles client IP addresses and runs on
          # every request, so the gates that matter are: a bad log path must
          # degrade to disabled rather than 500 the site, and a user agent
          # containing a double quote must not desynchronise the log parser.
          ARCHIVE_DB=off python src/test_accesslog.py

      - name: Build image locally
        # A Dockerfile error must surface here, not on the production host.
        # deploy_pull.sh builds the real image itself and rolls back on
        # failure, but a broken Dockerfile reaching it burns a deploy cycle
        # and leaves the timer retrying the same break every 5 minutes.
        run: docker build -t akl-trains:ci .

      - name: Render suite against the built image
        # Generated HTML/CSS is valid markup even when it styles nothing and
        # draws nothing: nothing throws and nothing logs. Only a render proves
        # it drew.
        #
        # AT_API_KEY is REQUIRED here, not optional. Measured without it: the
        # board renders no live rows and the alert bell never appears, so 8
        # assertions silently stop testing anything and 3 report FALSE
        # failures. A gate that degrades quietly when a credential is missing
        # is worse than no gate -- it reports green over an untested surface.
        env:
          AT_API_KEY: ${{ secrets.AT_API_KEY }}
        run: |
          test -n "$AT_API_KEY" || { echo "AT_API_KEY missing; the render gate would not be testing the live board"; exit 1; }
          # The suites must exist. They are deliberately un-ignored in
          # .gitignore; if that ever regresses, `docker cp` would copy nothing
          # and the step could look like a plain assertion failure instead of
          # a missing gate.
          test -f src/shot_px.py && test -f src/shot_ui4.py \
            || { echo "render suites missing from the checkout -- check .gitignore"; exit 1; }
          docker run -d --name akl-ci -e PORT=8080 -e ADMIN_TOKEN=ci \
            -e AT_API_KEY="$AT_API_KEY" \
            -e FEEDBACK_DB=/data/feedback.db akl-trains:ci
          sleep 10
          docker run -d --name shotci --network container:akl-ci \
            -e PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            mcr.microsoft.com/playwright/python:v1.49.0-jammy sleep 900
          docker exec shotci sh -c 'pip install -q playwright==1.49.0 pillow'
          docker exec shotci mkdir -p /out
          docker cp src/shot_px.py shotci:/s.py
          docker cp src/shot_ui4.py shotci:/s4.py
          docker exec shotci python /s.py http://127.0.0.1:8080 /out
          docker exec shotci python /s4.py http://127.0.0.1:8080 /out

      - name: Collect render screenshots
        # Uploaded even when the suite fails -- a failed visual run is exactly
        # when the pictures are worth having.
        if: always()
        run: docker cp shotci:/out ./render-output || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-screenshots
          path: render-output/
          if-no-files-found: ignore
          retention-days: 14

      - name: Tear down test rig
        if: always()
        run: docker rm -f akl-ci shotci || true

